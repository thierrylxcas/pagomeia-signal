<script>
console.log("SCRIPT INICIADO");

const SUPABASE_URL = "https://yxeowgpwumbirpmsmd.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4ZW93Z3B3dW1iaXJwcG1zc21kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY1OTIxMTIsImV4cCI6MjA4MjE2ODExMn0.AJbhuRS2f5ZnX2piwVoiPQ2RW3NK6SyqlsMrCxaAgkU";

const client = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

console.log("CLIENTE CRIADO", client);

async function testar(){
  console.log("CLICOU TESTAR");

  const { data, error } = await client
    .from("messages")
    .select("count", { count: "exact" });

  if(error){
    console.error("ERRO SUPABASE:", error);
    document.getElementById("status").innerText = "ERRO: " + error.message;
    return;
  }

  document.getElementById("status").innerText =
    "CONECTOU! Registros: " + data.length;
}
</script>

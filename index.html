<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>PagoMeia Watch Party</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(135deg,#ff9800,#ffcc00);
  font-family:Arial, sans-serif;
  color:#4a148c;
}
#app{
  max-width:1100px;
  margin:auto;
  padding:20px;
}
h1{
  text-align:center;
  margin-bottom:10px;
}
video{
  width:100%;
  background:#000;
  border-radius:16px;
  margin-bottom:10px;
}
#controls{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  justify-content:center;
  margin-bottom:10px;
}
input, button{
  padding:10px;
  border:none;
  border-radius:8px;
  font-size:14px;
}
button{
  background:#6a1b9a;
  color:#fff;
  cursor:pointer;
}
button:hover{
  opacity:.9;
}
#chat{
  background:rgba(255,255,255,0.35);
  padding:10px;
  border-radius:12px;
  height:250px;
  overflow-y:auto;
  margin-bottom:8px;
}
.msg{
  margin:4px 0;
}
#send{
  display:flex;
  gap:8px;
}
</style>
</head>

<body>
<div id="app">
  <h1>🎬 PagoMeia Watch Party</h1>

  <video id="video" autoplay playsinline></video>

  <div id="controls">
    <input id="username" placeholder="Seu nome">
    <button onclick="join()">Entrar</button>
    <button onclick="startShare()">🎥 Compartilhar Tela (HOST)</button>
  </div>

  <div id="chat"></div>

  <div id="send">
    <input id="msg" placeholder="Mensagem...">
    <button onclick="sendMsg()">Enviar</button>
  </div>
</div>

<!-- SUPABASE SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* ==================================================
   🔧 CONFIGURAÇÃO (MUDE SOMENTE ISSO)
================================================== */

// 🔹 SUPABASE
const SUPABASE_URL = "https://yxeowgpwumbirppmssmd.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_JYqJrlOtlH12J1xhgAaObw_MU4R8P0-";

// 🔹 WEBSOCKET (RENDER)
const WSS_URL = "https://pagomeia-signal.onrender.com/";

/* ================================================== */

const supabase = supabaseJs.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

const video = document.getElementById("video");
const chat = document.getElementById("chat");

let username = "";
let socket;
let pc;

/* ================= CHAT ================= */

function join(){
  username = document.getElementById("username").value.trim();
  if(!username){
    alert("Digite um nome");
    return;
  }

  socket = new WebSocket(WSS_URL);

  socket.onmessage = async e => {
    const data = JSON.parse(e.data);

    if(data.offer){
      pc = createPeer();
      await pc.setRemoteDescription(data.offer);
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      socket.send(JSON.stringify({ answer }));
    }

    if(data.candidate && pc){
      pc.addIceCandidate(data.candidate);
    }
  };

  listenChat();
}

function sendMsg(){
  const text = document.getElementById("msg").value.trim();
  if(!text) return;

  supabase.from("messages").insert({
    username: username,
    text: text
  });

  document.getElementById("msg").value = "";
}

function listenChat(){
  supabase.channel("chat")
    .on(
      "postgres_changes",
      { event:"INSERT", schema:"public", table:"messages" },
      payload => {
        const m = payload.new;
        chat.innerHTML += `<div class="msg"><b>${m.username}:</b> ${m.text}</div>`;
        chat.scrollTop = chat.scrollHeight;
      }
    )
    .subscribe();
}

/* ================= WEBRTC ================= */

function createPeer(){
  const peer = new RTCPeerConnection();

  peer.ontrack = e => {
    video.srcObject = e.streams[0];
  };

  peer.onicecandidate = e => {
    if(e.candidate){
      socket.send(JSON.stringify({ candidate: e.candidate }));
    }
  };

  return peer;
}

async function startShare(){
  if(!socket){
    alert("Entre primeiro com seu nome");
    return;
  }

  pc = createPeer();

  const stream = await navigator.mediaDevices.getDisplayMedia({
    video:true,
    audio:true
  });

  stream.getTracks().forEach(t => pc.addTrack(t, stream));
  video.srcObject = stream;

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  socket.send(JSON.stringify({ offer }));
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>PagoMeia Watch Party</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" href="data:,">

<style>
body{
  margin:0;
  background:linear-gradient(135deg,#ff9800,#ffcc00);
  font-family:Arial, sans-serif;
  color:#4a148c;
}
#app{
  max-width:900px;
  margin:auto;
  padding:20px;
}
h1{text-align:center}
.controls{
  display:flex;
  gap:8px;
  justify-content:center;
  margin:10px 0;
}
input,button{
  padding:10px;
  border:none;
  border-radius:8px;
}
button{
  background:#6a1b9a;
  color:#fff;
  cursor:pointer;
}
#chat{
  background:rgba(255,255,255,.4);
  padding:10px;
  height:250px;
  overflow-y:auto;
  border-radius:12px;
}
</style>
</head>

<body>

<div id="app">
  <h1>💬 PagoMeia Chat</h1>

  <div class="controls">
    <input id="username" placeholder="Seu nome">
    <button onclick="join()">Entrar</button>
  </div>

  <div id="chat"></div>

  <div class="controls">
    <input id="msg" placeholder="Mensagem">
    <button onclick="sendMsg()">Enviar</button>
  </div>
</div>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* ===== CONFIGURAÇÃO ===== */
const SUPABASE_URL = "https://SEU-PROJETO.supabase.co";
const SUPABASE_ANON_KEY = "SUA_ANON_PUBLIC_KEY";
/* ======================= */

const supabase = supabaseJs.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

let username = "";

function join(){
  username = document.getElementById("username").value.trim();
  if(!username){
    alert("Digite um nome");
    return;
  }

  alert("Entrou como " + username);
  listenChat();
}

function sendMsg(){
  const text = document.getElementById("msg").value.trim();
  if(!text || !username) return;

  supabase.from("messages").insert({
    username: username,
    text: text
  });

  document.getElementById("msg").value = "";
}

function listenChat(){
  supabase.channel("chat")
    .on(
      "postgres_changes",
      {
        event: "INSERT",
        schema: "public",
        table: "messages"
      },
      payload => {
        const m = payload.new;
        const chat = document.getElementById("chat");
        chat.innerHTML += `<div><b>${m.username}:</b> ${m.text}</div>`;
        chat.scrollTop = chat.scrollHeight;
      }
    )
    .subscribe();
}
</script>

</body>
</html>

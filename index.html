<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>PagoMeia Watch Party</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- remove favicon error -->
<link rel="icon" href="data:,">

<style>
body{
  margin:0;
  background:linear-gradient(135deg,#ff9800,#ffcc00);
  font-family:Arial, sans-serif;
  color:#4a148c;
}
#app{
  max-width:900px;
  margin:auto;
  padding:20px;
}
h1{text-align:center}
video{
  width:100%;
  height:300px;
  background:#000;
  border-radius:16px;
}
.controls{
  display:flex;
  gap:8px;
  justify-content:center;
  margin:10px 0;
}
input,button{
  padding:10px;
  border:none;
  border-radius:8px;
}
button{
  background:#6a1b9a;
  color:#fff;
  cursor:pointer;
}
#chat{
  background:rgba(255,255,255,.4);
  padding:10px;
  height:200px;
  overflow-y:auto;
  border-radius:12px;
}
</style>
</head>

<body>

<script>
alert("SCRIPT EXECUTOU — SE VOCÊ VÊ ISSO, O JS ESTÁ VIVO");
</script>

<div id="app">
  <h1>🎬 PagoMeia Watch Party</h1>

  <video id="video" autoplay playsinline></video>

  <div class="controls">
    <input id="username" placeholder="Seu nome">
    <button onclick="join()">Entrar</button>
    <button onclick="share()">Compartilhar (HOST)</button>
  </div>

  <div id="chat"></div>

  <div class="controls">
    <input id="msg" placeholder="Mensagem">
    <button onclick="sendMsg()">Enviar</button>
  </div>
</div>

<script>
/* ===== FUNÇÕES DIRETAS ===== */

function join(){
  alert("BOTÃO ENTRAR FUNCIONANDO");
}

function sendMsg(){
  alert("BOTÃO ENVIAR FUNCIONANDO");
}

function share(){
  alert("BOTÃO COMPARTILHAR FUNCIONANDO");
}
</script>

</body>
</html>
